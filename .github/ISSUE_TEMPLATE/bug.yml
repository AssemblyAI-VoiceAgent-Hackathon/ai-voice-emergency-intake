name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic identifiers and data only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe logs, screenshots, or example payloads with sensitive values removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all secrets and identifiable patient information from this report.
          required: true

